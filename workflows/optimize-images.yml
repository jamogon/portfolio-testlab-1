name: Optimize project images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download source JPGs from origin repo (public)
        run: |
          mkdir -p assets
          BASE="https://raw.githubusercontent.com/bposti/portfolio-lab/main/assets"
          for f in project-01 project-02 project-03 project-04; do
            curl -fsSL "$BASE/$f.jpg" -o "assets/$f.jpg"
            echo "Downloaded $f.jpg: $(stat -c%s assets/$f.jpg) bytes"
          done

      - name: Run image optimizer
        run: node js/tests/optimize-images.cjs

      - name: Commit generated WebP files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.webp
          if git diff --cached --quiet; then
            echo "No webp files generated"
            exit 1
          fi
          git commit -m "chore: generar imagenes WebP optimizadas (400w/800w)"
          git push
